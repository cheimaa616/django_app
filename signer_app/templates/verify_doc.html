{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <h2 class="mb-4">Verify Document</h2>
            <p class="text-muted">Upload a signed PDF to verify its integrity, signature, and version status.</p>
            
            {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
            {% endif %}

            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="pdf_file" class="form-label">Upload Signed PDF</label>
                    <input class="form-control" type="file" id="pdf_file" name="pdf_file" accept=".pdf" required>
                </div>
                
                <div class="mb-3">
                    <label for="doc_id" class="form-label">Document ID (optional if embedded in QR)</label>
                    <input type="text" class="form-control" id="doc_id" name="doc_id" placeholder="UUID format">
                    <div class="form-text">Normally scanned from the QR code.</div>
                </div>

                <button type="submit" class="btn btn-primary w-100">Verify Authenticity</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
